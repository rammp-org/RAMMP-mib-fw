## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  # What components/bsp needs (it has no manifest of its own; main/idf_component.yml
  # at the repo root carries these for the main firmware).
  espp/esp32-p4-eth: '>=1.3'
  espp/rtps: '>=1.4.3'
  espp/cdr: '>=1.3'
  espp/logger: '>=1.3'
  espp/task: '>=1.3'
  espp/timer: '>=1.3'
  espp/bno055: '>=1.3.10'
  # The actuator bus: TWAI transport, CANopen SDO client, MCP266 driver. 1.4.3 is
  # the release whose mcp266/canopen/twai sources this app was written against.
  espp/twai: '>=1.4.3'
  espp/canopen: '>=1.4.3'
  espp/mcp266: '>=1.4.3'
