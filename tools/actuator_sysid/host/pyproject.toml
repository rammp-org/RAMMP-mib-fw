[project]
name = "actuator-sysid-host"
version = "0.1.0"
description = "Host-side capture and analysis for the MIB actuator system-identification logger"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
