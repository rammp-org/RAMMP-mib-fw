## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  espp/esp32-p4-eth: '>=1.3'
  # 1.4.0 carries the RTPS fixes the MIB needs against the Jetson's CycloneDDS: the
  # SPDP participant-pool knob, SPDP DATA addressed to ENTITYID_UNKNOWN reaching the SPDP
  # reader, and same-subnet locator selection. 1.4.1 drops the `while (1)` in
  # SPDPAgent::processProxyData: before it, one participant past
  # SPDP_MAX_NUMBER_FOUND_PARTICIPANTS froze the RTPS receive task for good. 1.4.3 makes
  # the ArbitrationServer's services callable from rmw_cyclonedds_cpp (the Jetson's RMW):
  # before it the server read only the related_sample_identity inline QoS that Fast DDS
  # sends, not Cyclone's {guid, seq} payload header. It also holds a service reply until
  # the client's reply reader has acknowledged the writer, and acts on discovery disposes.
  espp/rtps: '>=1.4.3'
  espp/cdr: '>=1.3'
  espp/logger: '>=1.3'
  espp/nvs: '>=1.3'
  espp/task: '>=1.3'
  espp/timer: '>=1.3'
  # Left to itself the component manager settles on LVGL 9.4.0, whose Kconfig rejects
  # CONFIG_LV_MEM_SIZE_KILOBYTES=0 ("LV_MEM_SIZE >= 2kB is required"); 9.6 builds.
  lvgl/lvgl: '>=9.6.0'
  # The robot-wide e-stop (estop::Latch).
  estop_core:
    git: https://github.com/rammp-org/rammp-estop-core.git
    version: v0.3.0
  # estop_core fetches the RTPS spec's messages from git; this makes every user of it
  # take the rammp-rtps submodule's copy instead (a managed component would otherwise
  # win over EXTRA_COMPONENT_DIRS).
  rammp_rtps_messages:
    override_path: "../external/rammp-rtps/components/rammp_rtps_messages"
  espp/bno055: '>=1.3.10'
