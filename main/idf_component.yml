## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  espp/esp32-p4-eth: '>=1.3'
  espp/rtps: '>=1.3'
  espp/cdr: '>=1.3'
  espp/logger: '>=1.3'
  espp/task: '>=1.3'
  # The robot-wide e-stop (estop::Latch).
  estop_core:
    git: https://github.com/rammp-org/rammp-estop-core.git
    version: v0.3.0
  # estop_core depends on rammp_rtps_messages from rammp-rtps.git; use the submodule copy
  # instead so there is one set of messages (otherwise the managed copy shadows it).
  rammp_rtps_messages:
    override_path: "../external/rammp-rtps/components/rammp_rtps_messages"
