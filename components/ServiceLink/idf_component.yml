## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  # WebUSB vendor function on the P4's HS USB port, the stream_frame codec and the
  # module router it carries, and the telemetry protocol the panel plots.
  espp/usb_device: '>=1.3.5'
  espp/dispatcher: '>=1.3.5'
  espp/stream_frame: '>=1.3.5'
  espp/telemetry: '>=1.3.5'
  # Firmware updates over the service link, with rollback.
  espp/ota: '>=1.3.5'
  espp/task: '>=1.3'
  espp/logger: '>=1.3'
