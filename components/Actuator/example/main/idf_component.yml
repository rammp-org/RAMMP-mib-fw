## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.0'
  # What components/bsp needs (the repo's main/idf_component.yml carries these for the
  # firmware). mcp266 and motor_controller come from the Actuator component's manifest.
  espp/esp32-p4-eth: '>=1.3'
  espp/rtps: '>=1.4.3'
  espp/cdr: '>=1.3'
  espp/logger: '>=1.3'
  espp/task: '>=1.3'
  espp/timer: '>=1.3'
  espp/bno055: '>=1.3.10'
  espp/twai: '>=1.4.3'
  espp/canopen: '>=1.4.3'
  espp/nvs: '>=1.3.5'
  espp/cli: '>=1.3.5'
